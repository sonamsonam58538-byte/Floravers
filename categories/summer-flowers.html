<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Summer Flowers | FloraVerse</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/flowers.css">
    <link rel="stylesheet" href="../css/category.css">
</head>

<body class="category-page category-summer"></body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">FloraVerse</div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../flowers.html">Flowers</a>
            <a href="../flowers.html">Categories</a>
            <a href="#">Growing Guide</a>
            <a href="../login.html">Login</a>
        </nav>
    </header>


    <!-- HERO -->
    <section class="category-hero"
        style="background-image: url('../images/summer-background.jpg');">

        <div class="category-hero-content">

            <span class="category-tag">☀️ SUMMER COLLECTION</span>

            <h1>Summer Flowers</h1>

            <p>
                Bright, beautiful flowers that love warm sunshine
                and bring color to every summer garden.
            </p>

            <a href="../flowers.html" class="category-back-btn">
                ← Back to Flowers
            </a>

        </div>
    </section>


    <!-- FLOWER SECTION -->
    <main class="category-section">

        <div class="category-section-title">
            <div>
                <span class="category-tag">EXPLORE</span>
                <h2>Flowers of Summer</h2>
            </div>

            <span class="category-count" id="flowerCount"></span>
        </div>


        <div class="category-flower-grid" id="flowerGrid">
            <!-- Cards generated by JavaScript -->
        </div>

    </main>


    <!-- FOOTER -->
    <footer class="category-footer">
        <p>© 2026 FloraVerse • Explore the beauty of flowers 🌸</p>
    </footer>


    <script>

        const summerFlowers = [
            "Sunflower",
            "Marigold",
            "Hibiscus",
            "Coreopsis",
            "Daisy",
            "Dandelion",
            "Poppy",
            "Cosmos",
            "Gerbera",
            "Zinnia",
            "Dahlia",
            "Gardenia",
            "Plumeria",
            "Periwinkle",
            "Morning Glory",
            "Bougainvillea",
            "Petunia",
            "Begonia",
            "Aster",
            "Calendula",
            "Gladiolus",
            "Honeysuckle",
            "Hydrangea",
            "Impatiens",
            "Nasturtium",
            "Ranunculus",
            "Sweet Pea",
            "Yarrow",
            "Bird of Paradise",
            "Buttercup",
            "Fuchsia",
            "Hibiscus Mutabilis",
            "Hollyhock",
            "Jacaranda",
            "Lantana",
            "Mimosa",
            "Oleander",
            "Passion Flower",
            "Salvia",
            "Tuberose",
            "Verbena",
            "Water Lily",
            "Cosmos Sulphureus",
            "Goldenrod",
            "Morning Glory Blue",
            "Moonflower",
            "Nasturtium Yellow",
            "Protea",
            "Sea Holly",
            "Torch Ginger",
            "Trumpet Vine"
        ];


        /* Existing flower detail pages */

        const flowerDetails = {

            "Sunflower": "../flower-details/sunflower.html",

            "Marigold": "../flower-details/marigold.html",

            "Hibiscus": "../flower-details/hibiscus.html",

            "Daisy": "../flower-details/daisy.html",

            "Jasmine": "../flower-details/jasmine.html",

            "Lily": "../flower-details/lily.html",

            "Lotus": "../flower-details/lotus.html",

            "Lavender": "../flower-details/lavender.html",

            "Magnolia": "../flower-details/magnolia.html",

            "Orchid": "../flower-details/orchid.html",

            "Peony": "../flower-details/peony.html",

            "Cherry Blossom": "../flower-details/cherry-blossom.html",

            "Carnation": "../flower-details/carnation.html",

            "Daffodil": "../flower-details/daffodil.html"
        };


        /* Convert flower name to image filename */

        function flowerSlug(name) {

            return name
                .toLowerCase()
                .replace(/[’']/g, "")
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");
        }


        const grid = document.getElementById("flowerGrid");

        const count = document.getElementById("flowerCount");

        count.textContent = `${summerFlowers.length} Flowers`;


        summerFlowers.forEach((flower, index) => {

            const slug = flowerSlug(flower);

            const card = document.createElement("article");

            card.className = "category-flower-card";


            const imagePath = `../images/${slug}.jpg`;


            let actionHTML = "";

            if (flowerDetails[flower]) {

                actionHTML = `
                    <a
                        href="${flowerDetails[flower]}"
                        class="explore-flower-btn"
                    >
                        Explore ${flower} →
                    </a>
                `;

            } else {

                actionHTML = `
                    <div class="category-coming-soon">
                        Details coming soon
                    </div>
                `;

            }


            card.innerHTML = `

                <div class="category-image-wrapper">

                    <img
                        src="${imagePath}"
                        alt="${flower}"
                        class="category-flower-image"
                        loading="lazy"
                        onerror="this.src='../images/flower-placeholder.jpg'"
                    >

                    <span class="category-image-label">
                        ${String(index + 1).padStart(2, "0")}
                    </span>

                </div>


                <div class="category-flower-content">

                    <h3 class="category-flower-name">
                        ${flower}
                    </h3>

                    <p class="category-flower-category">
                        Summer Flower
                    </p>

                    ${actionHTML}

                </div>

            `;


            grid.appendChild(card);

        });

    </script>

</body>
</html>
